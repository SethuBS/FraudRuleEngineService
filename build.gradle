plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.owasp.dependencycheck' version '12.2.2'
}

group = 'com.capitec'
version = '0.0.1-SNAPSHOT'
description = 'Fraud Rule Engine Service API modular monolith scaffold'

ext['testcontainers.version'] = '1.21.4'
ext['tomcat.version'] = providers.gradleProperty('tomcat.version')
        .orElse(providers.environmentVariable('TOMCAT_VERSION'))
        .orElse('10.1.55')
        .get()
ext['log4j2.version'] = providers.gradleProperty('log4j2.version')
        .orElse(providers.environmentVariable('LOG4J2_VERSION'))
        .orElse('2.25.4')
        .get()

def checkstyleToolVersion = providers.gradleProperty('checkstyle.tool-version')
        .orElse(providers.environmentVariable('CHECKSTYLE_TOOL_VERSION'))
        .orElse('10.21.4')
def checkstyleBeanutilsVersion = providers.gradleProperty('checkstyle.commons-beanutils.version')
        .orElse(providers.environmentVariable('CHECKSTYLE_COMMONS_BEANUTILS_VERSION'))
        .orElse('1.11.0')
def checkstyleCommonsLangVersion = providers.gradleProperty('checkstyle.commons-lang3.version')
        .orElse(providers.environmentVariable('CHECKSTYLE_COMMONS_LANG3_VERSION'))
        .orElse('3.20.0')
def checkstylePlexusUtilsVersion = providers.gradleProperty('checkstyle.plexus-utils.version')
        .orElse(providers.environmentVariable('CHECKSTYLE_PLEXUS_UTILS_VERSION'))
        .orElse('3.6.1')
def dependencyCheckFailCvss = providers.gradleProperty('dependency-check.fail-cvss')
        .orElse(providers.environmentVariable('DEPENDENCY_CHECK_FAIL_CVSS'))
        .orElse('9.0')
def dependencyCheckDataDirectory = providers.gradleProperty('dependency-check.data-directory')
        .orElse(providers.environmentVariable('DEPENDENCY_CHECK_DATA_DIRECTORY'))
        .orElse("${rootDir}/.gradle/dependency-check-data")
def dependencyCheckRetireJsEnabled = providers.gradleProperty('dependency-check.retirejs.enabled')
        .orElse(providers.environmentVariable('DEPENDENCY_CHECK_RETIREJS_ENABLED'))
        .orElse('false')
def dependencyCheckOssIndexEnabled = providers.gradleProperty('dependency-check.oss-index.enabled')
        .orElse(providers.environmentVariable('DEPENDENCY_CHECK_OSS_INDEX_ENABLED'))
        .orElse('false')
def swaggerUiVersion = providers.gradleProperty('swagger-ui.version')
        .orElse(providers.environmentVariable('SWAGGER_UI_VERSION'))
        .orElse('5.32.5')

def testPostgresImage = providers.systemProperty('test.postgres.image')
        .orElse(providers.environmentVariable('TEST_POSTGRES_IMAGE'))
        .orElse('postgres:16-alpine')
def testPostgresStartupTimeout = providers.systemProperty('test.postgres.startup-timeout')
        .orElse(providers.environmentVariable('TEST_POSTGRES_STARTUP_TIMEOUT'))
        .orElse('PT2M')
def testJvmArgs = providers.gradleProperty('test.jvm-args')
        .orElse(providers.environmentVariable('TEST_JVM_ARGS'))
        .orElse('-Xshare:off')
def testRootLoggingLevel = providers.gradleProperty('test.logging.level.root')
        .orElse(providers.environmentVariable('TEST_LOGGING_LEVEL_ROOT'))
        .orElse('WARN')

base {
    archivesName = 'fraud-rule-engine-service'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named('bootJar') {
    manifest {
        attributes(
                'Implementation-Title': 'Fraud Rule Engine Service API',
                'Implementation-Version': project.version
        )
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation "org.webjars:swagger-ui:${swaggerUiVersion.get()}"
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'org.postgresql:postgresql:42.7.12'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:redpanda'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleToolVersion.get()}"
    checkstyle "commons-beanutils:commons-beanutils:${checkstyleBeanutilsVersion.get()}"
    checkstyle "org.apache.commons:commons-lang3:${checkstyleCommonsLangVersion.get()}"
    checkstyle "org.codehaus.plexus:plexus-utils:${checkstylePlexusUtilsVersion.get()}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

checkstyle {
    toolVersion = checkstyleToolVersion.get()
    configDirectory = file("${rootDir}/config/checkstyle")
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'fraud.raw-payload.cleanup.enabled', 'false'
    systemProperty 'test.postgres.image', testPostgresImage.get()
    systemProperty 'test.postgres.startup-timeout', testPostgresStartupTimeout.get()
    systemProperty 'logging.level.root', testRootLoggingLevel.get()
    if (!testJvmArgs.get().trim().isEmpty()) {
        jvmArgs testJvmArgs.get().trim().split('\\s+') as List
    }
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        if (!System.getenv('DOCKER_HOST')) {
            environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine_linux'
        }
    }
}

dependencyCheck {
    autoUpdate = (System.getenv('DEPENDENCY_CHECK_AUTO_UPDATE') ?: 'true').toBoolean()
    failOnError = false
    failBuildOnCVSS = dependencyCheckFailCvss.get() as BigDecimal
    formats = ['HTML', 'JSON']
    suppressionFile = "${rootDir}/config/dependency-check/suppressions.xml"
    data.directory = dependencyCheckDataDirectory.get()
    analyzers {
        assemblyEnabled = false
        ossIndexEnabled = dependencyCheckOssIndexEnabled.get().toBoolean()
        retirejs {
            enabled = dependencyCheckRetireJsEnabled.get().toBoolean()
        }
        ossIndex {
            enabled = dependencyCheckOssIndexEnabled.get().toBoolean()
        }
    }
    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
        validForHours = 24
        resultsPerPage = (System.getenv('DEPENDENCY_CHECK_NVD_RESULTS_PER_PAGE') ?: '500') as Integer
    }
}
