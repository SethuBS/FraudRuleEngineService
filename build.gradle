plugins {
    id 'java'
    id 'checkstyle'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.owasp.dependencycheck' version '12.2.2'
}

group = 'com.capitec'
version = '0.0.1-SNAPSHOT'
description = 'Fraud Rule Engine Service API modular monolith scaffold'

ext['testcontainers.version'] = '1.21.4'

def testPostgresImage = providers.systemProperty('test.postgres.image')
        .orElse(providers.environmentVariable('TEST_POSTGRES_IMAGE'))
        .orElse('postgres:16-alpine')
def testPostgresStartupTimeout = providers.systemProperty('test.postgres.startup-timeout')
        .orElse(providers.environmentVariable('TEST_POSTGRES_STARTUP_TIMEOUT'))
        .orElse('PT2M')

base {
    archivesName = 'fraud-rule-engine-service'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named('bootJar') {
    manifest {
        attributes(
                'Implementation-Title': 'Fraud Rule Engine Service API',
                'Implementation-Version': project.version
        )
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'org.postgresql:postgresql:42.7.11'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

checkstyle {
    toolVersion = '10.21.4'
    configDirectory = file("${rootDir}/config/checkstyle")
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'fraud.raw-payload.cleanup.enabled', 'false'
    systemProperty 'test.postgres.image', testPostgresImage.get()
    systemProperty 'test.postgres.startup-timeout', testPostgresStartupTimeout.get()
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        if (!System.getenv('DOCKER_HOST')) {
            environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine_linux'
        }
    }
}

dependencyCheck {
    autoUpdate = true
    failOnError = false
    failBuildOnCVSS = 11.0
    formats = ['HTML', 'JSON']
    suppressionFile = "${rootDir}/config/dependency-check/suppressions.xml"
    data.directory = System.getenv('DEPENDENCY_CHECK_DATA_DIRECTORY') ?: "${rootDir}/build/dependency-check-data"
    analyzers {
        assemblyEnabled = false
    }
    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
        validForHours = 24
        resultsPerPage = (System.getenv('DEPENDENCY_CHECK_NVD_RESULTS_PER_PAGE') ?: '500') as Integer
    }
}
