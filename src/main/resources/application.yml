spring:
  application:
    name: FraudRuleEngineService
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fraud_rule_engine}
    username: ${SPRING_DATASOURCE_USERNAME:fraud}
    password: ${SPRING_DATASOURCE_PASSWORD:fraud}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

fraud:
  evaluation:
    risk-thresholds:
      medium: ${FRAUD_EVALUATION_RISK_THRESHOLD_MEDIUM:25}
      high: ${FRAUD_EVALUATION_RISK_THRESHOLD_HIGH:50}
      critical: ${FRAUD_EVALUATION_RISK_THRESHOLD_CRITICAL:75}
    decision-thresholds:
      review: ${FRAUD_EVALUATION_DECISION_THRESHOLD_REVIEW:MEDIUM}
      flagged: ${FRAUD_EVALUATION_DECISION_THRESHOLD_FLAGGED:HIGH}
