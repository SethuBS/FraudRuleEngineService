spring:
  application:
    name: FraudRuleEngineService
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fraud_rule_engine}
    username: ${SPRING_DATASOURCE_USERNAME:fraud}
    password: ${SPRING_DATASOURCE_PASSWORD:fraud}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

fraud:
  api:
    paths:
      transaction-evaluations: ${FRAUD_API_PATH_TRANSACTION_EVALUATIONS:/api/v1/transaction-evaluations}
    validation:
      merchant-category-max-length: ${FRAUD_API_VALIDATION_MERCHANT_CATEGORY_MAX_LENGTH:80}
  time:
    zone-id: ${FRAUD_TIME_ZONE_ID:UTC}
  evaluation:
    risk-thresholds:
      medium: ${FRAUD_EVALUATION_RISK_THRESHOLD_MEDIUM:25}
      high: ${FRAUD_EVALUATION_RISK_THRESHOLD_HIGH:50}
      critical: ${FRAUD_EVALUATION_RISK_THRESHOLD_CRITICAL:75}
    decision-thresholds:
      review: ${FRAUD_EVALUATION_DECISION_THRESHOLD_REVIEW:MEDIUM}
      flagged: ${FRAUD_EVALUATION_DECISION_THRESHOLD_FLAGGED:HIGH}
  persistence:
    default-alert-status: ${FRAUD_PERSISTENCE_DEFAULT_ALERT_STATUS:OPEN}
  security:
    public-paths: ${FRAUD_SECURITY_PUBLIC_PATHS:/actuator/health/**}
  idempotency:
    completed-status: ${FRAUD_IDEMPOTENCY_COMPLETED_STATUS:COMPLETED}
  rule-catalog:
    enabled-by-default: ${FRAUD_RULE_CATALOG_ENABLED_BY_DEFAULT:true}
    seed-on-startup: ${FRAUD_RULE_CATALOG_SEED_ON_STARTUP:true}
  rules:
    foreign-country-transaction:
      expected-country: ${FRAUD_RULES_FOREIGN_COUNTRY_TRANSACTION_EXPECTED_COUNTRY:ZA}
      default-score: ${FRAUD_RULES_FOREIGN_COUNTRY_TRANSACTION_DEFAULT_SCORE:45}
      severity: ${FRAUD_RULES_FOREIGN_COUNTRY_TRANSACTION_SEVERITY:HIGH}
    high-value-transaction:
      threshold-amount: ${FRAUD_RULES_HIGH_VALUE_TRANSACTION_THRESHOLD_AMOUNT:10000.00}
      default-score: ${FRAUD_RULES_HIGH_VALUE_TRANSACTION_DEFAULT_SCORE:55}
      severity: ${FRAUD_RULES_HIGH_VALUE_TRANSACTION_SEVERITY:HIGH}
    risky-merchant-category:
      risk-categories:
        - GAMBLING
        - CRYPTO
        - JEWELRY
      default-score: ${FRAUD_RULES_RISKY_MERCHANT_CATEGORY_DEFAULT_SCORE:30}
      severity: ${FRAUD_RULES_RISKY_MERCHANT_CATEGORY_SEVERITY:MEDIUM}
    velocity-transaction:
      transaction-count-threshold: ${FRAUD_RULES_VELOCITY_TRANSACTION_COUNT_THRESHOLD:5}
      time-window-minutes: ${FRAUD_RULES_VELOCITY_TRANSACTION_TIME_WINDOW_MINUTES:10}
      default-score: ${FRAUD_RULES_VELOCITY_TRANSACTION_DEFAULT_SCORE:35}
      severity: ${FRAUD_RULES_VELOCITY_TRANSACTION_SEVERITY:HIGH}
  raw-payload:
    retention-duration: ${FRAUD_RAW_PAYLOAD_RETENTION_DURATION:P7D}
    redacted-value: ${FRAUD_RAW_PAYLOAD_REDACTED_VALUE:[REDACTED]}
    sensitive-field-names: ${FRAUD_RAW_PAYLOAD_SENSITIVE_FIELD_NAMES:accountNumber,accountNo,iban,cardNumber,cardPan,pan,cvv,cvc,expiry,authorization,authorizationHeader,accessToken,refreshToken,authToken,bearerToken,token,idNumber,nationalId,passportNumber,email,phoneNumber,firstName,lastName,fullName,customerName}
