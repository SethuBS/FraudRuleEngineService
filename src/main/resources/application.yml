spring:
  application:
    name: FraudRuleEngineService
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fraud_rule_engine}
    username: ${SPRING_DATASOURCE_USERNAME:fraud}
    password: ${SPRING_DATASOURCE_PASSWORD:fraud}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

fraud:
  api:
    paths:
      transaction-evaluations: ${FRAUD_API_PATH_TRANSACTION_EVALUATIONS:/api/v1/transaction-evaluations}
      transactions-evaluate: ${FRAUD_API_PATH_TRANSACTIONS_EVALUATE:/api/v1/transactions/evaluate}
      fraud-alerts: ${FRAUD_API_PATH_FRAUD_ALERTS:/api/v1/fraud-alerts}
      fraud-alert-detail: ${FRAUD_API_PATH_FRAUD_ALERT_DETAIL:/api/v1/fraud-alerts/{alertId}}
      transaction-fraud-evaluation: ${FRAUD_API_PATH_TRANSACTION_FRAUD_EVALUATION:/api/v1/transactions/{transactionId}/fraud-evaluation}
    pagination:
      minimum-page: ${FRAUD_API_PAGINATION_MINIMUM_PAGE:0}
      minimum-size: ${FRAUD_API_PAGINATION_MINIMUM_SIZE:1}
      default-page: ${FRAUD_API_PAGINATION_DEFAULT_PAGE:0}
      default-size: ${FRAUD_API_PAGINATION_DEFAULT_SIZE:20}
      max-size: ${FRAUD_API_PAGINATION_MAX_SIZE:100}
    validation:
      merchant-category-max-length: ${FRAUD_API_VALIDATION_MERCHANT_CATEGORY_MAX_LENGTH:80}
  time:
    zone-id: ${FRAUD_TIME_ZONE_ID:UTC}
  evaluation:
    maximum-score: ${FRAUD_EVALUATION_MAXIMUM_SCORE:100}
    risk-thresholds:
      medium: ${FRAUD_EVALUATION_RISK_THRESHOLD_MEDIUM:25}
      high: ${FRAUD_EVALUATION_RISK_THRESHOLD_HIGH:50}
      critical: ${FRAUD_EVALUATION_RISK_THRESHOLD_CRITICAL:75}
    decision-thresholds:
      review: ${FRAUD_EVALUATION_DECISION_THRESHOLD_REVIEW:MEDIUM}
      flagged: ${FRAUD_EVALUATION_DECISION_THRESHOLD_FLAGGED:HIGH}
  persistence:
    default-alert-status: ${FRAUD_PERSISTENCE_DEFAULT_ALERT_STATUS:OPEN}
  security:
    public-paths: ${FRAUD_SECURITY_PUBLIC_PATHS:/actuator/health/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html}
  openapi:
    title: ${FRAUD_OPENAPI_TITLE:Fraud Rule Engine Service API}
    description: ${FRAUD_OPENAPI_DESCRIPTION:Evaluates categorized transaction events against explainable fraud rules and exposes stored fraud alerts and decisions.}
    version: ${FRAUD_OPENAPI_VERSION:0.0.1-SNAPSHOT}
    bearer-security-scheme-name: ${FRAUD_OPENAPI_BEARER_SECURITY_SCHEME_NAME:bearer-jwt}
    bearer-scheme: ${FRAUD_OPENAPI_BEARER_SCHEME:bearer}
    bearer-format: ${FRAUD_OPENAPI_BEARER_FORMAT:JWT}
    examples:
      high-risk-transaction: ${FRAUD_OPENAPI_EXAMPLE_HIGH_RISK_TRANSACTION:classpath:openapi/examples/high-risk-transaction.json}
      low-risk-transaction: ${FRAUD_OPENAPI_EXAMPLE_LOW_RISK_TRANSACTION:classpath:openapi/examples/low-risk-transaction.json}
      duplicate-event: ${FRAUD_OPENAPI_EXAMPLE_DUPLICATE_EVENT:classpath:openapi/examples/duplicate-event.json}
      high-risk-response: ${FRAUD_OPENAPI_EXAMPLE_HIGH_RISK_RESPONSE:classpath:openapi/examples/high-risk-evaluation-response.json}
      low-risk-response: ${FRAUD_OPENAPI_EXAMPLE_LOW_RISK_RESPONSE:classpath:openapi/examples/low-risk-evaluation-response.json}
      alert-list-response: ${FRAUD_OPENAPI_EXAMPLE_ALERT_LIST_RESPONSE:classpath:openapi/examples/fraud-alert-list-response.json}
      alert-response: ${FRAUD_OPENAPI_EXAMPLE_ALERT_RESPONSE:classpath:openapi/examples/fraud-alert-response.json}
      validation-error-response: ${FRAUD_OPENAPI_EXAMPLE_VALIDATION_ERROR_RESPONSE:classpath:openapi/examples/validation-error-response.json}
      not-found-response: ${FRAUD_OPENAPI_EXAMPLE_NOT_FOUND_RESPONSE:classpath:openapi/examples/not-found-response.json}
  idempotency:
    completed-status: ${FRAUD_IDEMPOTENCY_COMPLETED_STATUS:COMPLETED}
  rule-catalog:
    enabled-by-default: ${FRAUD_RULE_CATALOG_ENABLED_BY_DEFAULT:true}
    seed-on-startup: ${FRAUD_RULE_CATALOG_SEED_ON_STARTUP:true}
  rules:
    foreign-country-transaction:
      expected-country: ${FRAUD_RULES_FOREIGN_COUNTRY_TRANSACTION_EXPECTED_COUNTRY:ZA}
      default-score: ${FRAUD_RULES_FOREIGN_COUNTRY_TRANSACTION_DEFAULT_SCORE:45}
      severity: ${FRAUD_RULES_FOREIGN_COUNTRY_TRANSACTION_SEVERITY:HIGH}
    high-value-transaction:
      threshold-amount: ${FRAUD_RULES_HIGH_VALUE_TRANSACTION_THRESHOLD_AMOUNT:10000.00}
      default-score: ${FRAUD_RULES_HIGH_VALUE_TRANSACTION_DEFAULT_SCORE:55}
      severity: ${FRAUD_RULES_HIGH_VALUE_TRANSACTION_SEVERITY:HIGH}
    risky-merchant-category:
      risk-categories:
        - GAMBLING
        - CRYPTO
        - JEWELRY
      default-score: ${FRAUD_RULES_RISKY_MERCHANT_CATEGORY_DEFAULT_SCORE:30}
      severity: ${FRAUD_RULES_RISKY_MERCHANT_CATEGORY_SEVERITY:MEDIUM}
    suspicious-merchant:
      merchant-ids:
        - MERCHANT-WATCHLIST
      merchant-name-fragments:
        - WATCHLISTED
        - HIGH RISK TRADERS
      default-score: ${FRAUD_RULES_SUSPICIOUS_MERCHANT_DEFAULT_SCORE:50}
      severity: ${FRAUD_RULES_SUSPICIOUS_MERCHANT_SEVERITY:HIGH}
    unusual-amount:
      multiplier-threshold: ${FRAUD_RULES_UNUSUAL_AMOUNT_MULTIPLIER_THRESHOLD:3.00}
      default-score: ${FRAUD_RULES_UNUSUAL_AMOUNT_DEFAULT_SCORE:45}
      severity: ${FRAUD_RULES_UNUSUAL_AMOUNT_SEVERITY:HIGH}
    velocity-transaction:
      transaction-count-threshold: ${FRAUD_RULES_VELOCITY_TRANSACTION_COUNT_THRESHOLD:5}
      time-window-minutes: ${FRAUD_RULES_VELOCITY_TRANSACTION_TIME_WINDOW_MINUTES:10}
      default-score: ${FRAUD_RULES_VELOCITY_TRANSACTION_DEFAULT_SCORE:35}
      severity: ${FRAUD_RULES_VELOCITY_TRANSACTION_SEVERITY:HIGH}
  raw-payload:
    retention-duration: ${FRAUD_RAW_PAYLOAD_RETENTION_DURATION:P7D}
    redacted-value: ${FRAUD_RAW_PAYLOAD_REDACTED_VALUE:[REDACTED]}
    sensitive-field-names: ${FRAUD_RAW_PAYLOAD_SENSITIVE_FIELD_NAMES:accountNumber,accountNo,iban,cardNumber,cardPan,pan,cvv,cvc,expiry,authorization,authorizationHeader,accessToken,refreshToken,authToken,bearerToken,token,idNumber,nationalId,passportNumber,email,phoneNumber,firstName,lastName,fullName,customerName}
