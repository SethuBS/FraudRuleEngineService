services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud_rule_engine
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - fraud-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud_rule_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  fraud-rule-engine:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fraud_rule_engine
      SPRING_DATASOURCE_USERNAME: fraud
      SPRING_DATASOURCE_PASSWORD: fraud
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fraud-postgres-data:
