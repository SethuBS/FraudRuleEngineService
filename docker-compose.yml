services:
  redpanda:
    image: ${REDPANDA_IMAGE:-redpandadata/redpanda:v26.1.14}
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "${REDPANDA_HOST_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_rule_engine}
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - fraud-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fraud-rule-engine:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fraud_rule_engine}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fraud}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fraud}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.postgresql.Driver}
      SPRING_DATASOURCE_HIKARI_POOL_NAME: ${SPRING_DATASOURCE_HIKARI_POOL_NAME:-FraudRuleEngineHikariPool}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-5}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-10}
      SPRING_DATASOURCE_HIKARI_AUTO_COMMIT: ${SPRING_DATASOURCE_HIKARI_AUTO_COMMIT:-true}
      SPRING_DATASOURCE_HIKARI_TRANSACTION_ISOLATION: ${SPRING_DATASOURCE_HIKARI_TRANSACTION_ISOLATION:-TRANSACTION_READ_COMMITTED}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${SPRING_KAFKA_CONSUMER_GROUP_ID:-fraud-rule-engine-service}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      FRAUD_KAFKA_ENABLED: ${FRAUD_KAFKA_ENABLED:-true}
      FRAUD_KAFKA_TRANSACTION_EVENTS_TOPIC: ${FRAUD_KAFKA_TRANSACTION_EVENTS_TOPIC:-transaction-events}
      FRAUD_KAFKA_DEAD_LETTER_TOPIC: ${FRAUD_KAFKA_DEAD_LETTER_TOPIC:-transaction-events.dlq}
      FRAUD_KAFKA_CONSUMER_GROUP: ${FRAUD_KAFKA_CONSUMER_GROUP:-fraud-rule-engine-service}
      FRAUD_SECURITY_JWT_ISSUER_URI: ${FRAUD_SECURITY_JWT_ISSUER_URI:-fraud-rule-engine-local}
      FRAUD_SECURITY_JWT_AUDIENCES: ${FRAUD_SECURITY_JWT_AUDIENCES:-fraud-rule-engine-service}
      FRAUD_SECURITY_JWT_JWK_SET_URI: ""
      FRAUD_SECURITY_JWT_PUBLIC_KEY_LOCATION: ${FRAUD_SECURITY_JWT_PUBLIC_KEY_LOCATION:-classpath:security/local-dev-public-key.pem}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,metrics,prometheus}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      LOGGING_LEVEL_HIBERNATE_CONNECTION_POOLING: ${LOGGING_LEVEL_HIBERNATE_CONNECTION_POOLING:-WARN}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  fraud-postgres-data:
